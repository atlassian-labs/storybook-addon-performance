<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="120" cy="120" r="110" fill="#FF4785" opacity="0.1"/>
  
  <!-- Stopwatch Body -->
  <circle cx="120" cy="130" r="80" fill="none" stroke="#FF4785" stroke-width="12"/>
  
  <!-- Stopwatch Button -->
  <rect x="110" y="40" width="20" height="30" rx="5" fill="#FF4785"/>
  
  <!-- Clock Hands -->
  <path d="M120 130 L120 80" stroke="#1EA7FD" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 130 L170 130" stroke="#1EA7FD" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Performance Indicator Lines -->
  <path d="M60 130 L80 130" stroke="#37D5D3" stroke-width="4"/>
  <path d="M160 130 L180 130" stroke="#37D5D3" stroke-width="4"/>
  <path d="M120 70 L120 90" stroke="#37D5D3" stroke-width="4"/>
  <path d="M120 170 L120 190" stroke="#37D5D3" stroke-width="4"/>
</svg>