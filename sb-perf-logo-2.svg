<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bars with play cutout logo">
  <title>Performance bars</title>
  <defs>
    <!-- Mask to cut a play triangle out of the bars -->
    <mask id="play-cut">
      <rect x="0" y="0" width="128" height="128" fill="#fff"/>
      <polygon points="76,48 100,64 76,80" fill="#000"/>
    </mask>
  </defs>
  <!-- Container panel -->
  <rect x="16" y="20" width="96" height="88" rx="14" ry="14" fill="none" stroke="#00B8D9" stroke-width="8"/>
  <!-- Bars group with play hole -->
  <g mask="url(#play-cut)">
    <rect x="32" y="72" width="16" height="24" rx="8" fill="#2684FF"/>
    <rect x="56" y="56" width="16" height="40" rx="8" fill="#2684FF"/>
    <rect x="80" y="36" width="16" height="60" rx="8" fill="#2684FF"/>
  </g>
</svg>
