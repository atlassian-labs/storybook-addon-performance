<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stopwatch/timer design representing performance timing -->
  <circle cx="32" cy="36" r="24" stroke="#6366F1" stroke-width="4" fill="none"/>
  
  <!-- Timer crown/button -->
  <rect x="29" y="8" width="6" height="8" rx="3" fill="#6366F1"/>
  
  <!-- Clock hands showing optimal timing -->
  <line x1="32" y1="36" x2="32" y2="20" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="44" y2="36" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center point -->
  <circle cx="32" cy="36" r="2" fill="#4F46E5"/>
  
  <!-- Performance markers -->
  <circle cx="56" cy="36" r="1.5" fill="#818CF8"/>
  <circle cx="8" cy="36" r="1.5" fill="#818CF8"/>
  <circle cx="32" cy="12" r="1.5" fill="#818CF8"/>
  <circle cx="32" cy="60" r="1.5" fill="#818CF8"/>
</svg>